[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kumapulse"
version = "0.1.0"
description = "Uptime Kuma to Discord mirror bot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "discord.py==2.4.0",
  "aiohttp==3.10.11",
  "python-dotenv==1.0.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
